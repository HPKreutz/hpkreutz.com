<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do — The Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark">◆</div>
    <div><div class="name">The Desk</div><div class="sub">Hays, KS · daily dashboard</div></div>
  </div>
  <nav class="pages">
    <a href="index.html">Home</a>
    <a href="markets.html">Markets</a>
    <a href="sports.html">Sports</a>
    <a href="fitness.html">Fitness</a>
    <a href="todo.html">To-Do</a>
    <a href="tools.html">Tools</a>
    <a href="recipes.html">Recipes</a>
    <a href="insurance.html">Insurance</a>
  </nav>
  <div id="clock">—</div>
</header>

<div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>

<main>
  <h1 class="page-title">To-Do</h1>
  <p class="page-sub">Quick tasks — quotes to send, follow-ups, renewals, whatever's on deck.</p>

  <div class="card">
    <div class="card-body">
      <div class="todo-add">
        <input type="text" id="newTodo" placeholder="Add a task and press Enter…">
        <select id="newTodoCat" style="max-width:160px; margin-bottom:0;">
          <option value="General">General</option>
          <option value="Quotes">Quotes</option>
          <option value="Follow-up">Follow-up</option>
          <option value="Renewal">Renewal</option>
          <option value="Personal">Personal</option>
        </select>
        <button onclick="addTodo()">Add</button>
      </div>
      <ul class="todo-list" id="todoList"></ul>
      <p class="empty" id="todoEmpty" style="display:none;">Nothing on the list — add a task above.</p>
    </div>
  </div>
</main>

<footer>
  <span>© <span id="year"></span> hpkreutz.com — Hays, KS</span>
  <span>Markets · Sports · Fitness · Tasks · Tools</span>
</footer>

<script src="assets/app.js"></script>
<script>
  function render(){
    const items = hkGetTodos();
    const list = document.getElementById('todoList');
    document.getElementById('todoEmpty').style.display = items.length ? 'none' : 'block';
    list.innerHTML = items.map((t, i) => `
      <li class="${t.done ? 'done' : ''}">
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${i})">
        <span class="text">${t.text}${t.cat ? ` <span class="mono" style="color:var(--muted); font-size:11px;">· ${t.cat}</span>` : ''}</span>
        <span class="del" onclick="deleteTodo(${i})">remove</span>
      </li>
    `).join('');
  }

  function addTodo(){
    const input = document.getElementById('newTodo');
    const text = input.value.trim();
    if(!text) return;
    const cat = document.getElementById('newTodoCat').value;
    const items = hkGetTodos();
    items.push({ text, cat, done: false });
    hkSaveTodos(items);
    input.value = '';
    render();
  }

  function toggleTodo(i){
    const items = hkGetTodos();
    items[i].done = !items[i].done;
    hkSaveTodos(items);
    render();
  }

  function deleteTodo(i){
    const items = hkGetTodos();
    items.splice(i, 1);
    hkSaveTodos(items);
    render();
  }

  document.getElementById('newTodo').addEventListener('keydown', e => {
    if(e.key === 'Enter') addTodo();
  });

  render();

  hkBuildTicker([
    {label:'Open tasks', value: hkGetTodos().filter(t=>!t.done).length},
    {label:'Completed', value: hkGetTodos().filter(t=>t.done).length},
  ]);
</script>

</body>
</html>
